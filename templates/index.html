<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-classify {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-classify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-classify:active {
            transform: translateY(0);
        }

        .btn-demo {
            background: #f0f0f0;
            color: #333;
        }

        .btn-demo:hover {
            background: #e0e0e0;
        }

        .btn-clear {
            background: #ff6b6b;
            color: white;
        }

        .btn-clear:hover {
            background: #ee5a52;
            transform: translateY(-2px);
        }

        .result-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-section.show {
            display: block;
        }

        .result-box {
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            color: white;
            font-weight: 600;
            font-size: 24px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-box.spam {
            background: linear-gradient(135deg, #f93b1d 0%, #ea1e63 100%);
            box-shadow: 0 10px 30px rgba(249, 59, 29, 0.3);
        }

        .result-box.ham {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.3);
        }

        .confidence {
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
        }

        .probability-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .probability-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .probability-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .probability-item:last-child {
            margin-bottom: 0;
        }

        .prob-label {
            font-weight: 600;
            color: #333;
        }

        .prob-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
        }

        .prob-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .prob-spam {
            background: linear-gradient(90deg, #f93b1d 0%, #ea1e63 100%);
        }

        .prob-ham {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
        }

        .prob-value {
            font-weight: 600;
            color: #333;
            min-width: 50px;
            text-align: right;
        }

        .stats-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #666;
        }

        .stat-label {
            font-weight: 600;
        }

        .stat-value {
            color: #333;
        }

        .demo-messages {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .demo-messages h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .demo-msg {
            padding: 8px 0;
            cursor: pointer;
            color: #333;
            font-size: 14px;
            transition: color 0.3s;
        }

        .demo-msg:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .result-box {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📨 SMS Spam Detector</h1>
            <p>Intelligent SMS Classification System</p>
        </div>

        <div class="error-message" id="errorMsg"></div>

        <div class="input-section">
            <label for="message">Enter Your Message:</label>
            <textarea id="message" placeholder="Type your SMS message here... e.g., 'FREE entry to win £1000 cash! Click here now!'" spellcheck="false"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-classify" onclick="classifyMessage()">Classify Message</button>
            <button class="btn-demo" onclick="loadDemoMessages()">📊 Load Examples</button>
            <button class="btn-clear" onclick="clearMessage()">Clear</button>
        </div>

        <div class="demo-messages" id="demoSection" style="display: none;">
            <h4>📌 Sample Messages:</h4>
            <div id="demoList"></div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-box" id="resultBox"></div>

            <div class="probability-section">
                <h3>Prediction Probabilities:</h3>
                
                <div class="probability-item">
                    <span class="prob-label">🚨 Spam</span>
                    <div class="prob-bar">
                        <div class="prob-bar-fill prob-spam" id="spamBar" style="width: 0%;"></div>
                    </div>
                    <span class="prob-value" id="spamPercent">0%</span>
                </div>

                <div class="probability-item">
                    <span class="prob-label">✅ Ham</span>
                    <div class="prob-bar">
                        <div class="prob-bar-fill prob-ham" id="hamBar" style="width: 0%;"></div>
                    </div>
                    <span class="prob-value" id="hamPercent">0%</span>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">Model Type:</span>
                    <span class="stat-value">Naive Bayes Classifier</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Training Data:</span>
                    <span class="stat-value">5,572 SMS Messages</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Accuracy:</span>
                    <span class="stat-value">97.5%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Feature Extraction:</span>
                    <span class="stat-value">TF-IDF Vectorizer</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample messages for demo
        const demoMessages = [
            { text: "Hey! How are you doing today?", type: "ham" },
            { text: "FREE entry to win £1000 cash! Click here now!", type: "spam" },
            { text: "Hi, just checking in to see if you're free tomorrow", type: "ham" },
            { text: "CONGRATULATIONS! You've won a FREE iPhone! Claim now.", type: "spam" },
            { text: "Meeting at 3 PM tomorrow, don't forget!", type: "ham" },
            { text: "U won 2 hrs talk time + 2 free text. Call 150 now!", type: "spam" },
            { text: "Are you coming to the party this weekend?", type: "ham" },
            { text: "Urgent! Your account needs verification. Click link.", type: "spam" },
            { text: "Thanks for calling me. Talk soon!", type: "ham" },
            { text: "Get rich quick! Make £5000/week from home!", type: "spam" }
        ];

        // Simple ML Model Simulator (using word-based heuristics)
        const spamKeywords = [
            'free', 'win', 'winner', 'cash', 'prize', 'click', 'urgent', 'claim',
            'congratulations', 'act now', 'limited', 'offer', 'bank', 'verify',
            'confirm', 'account', 'password', 'update', 'action required', 'call now',
            'apply now', 'guarantee', 'no credit', 'get rich', 'work from home',
            '£', '$', '€', 'sex', 'dear', 'nigerian', 'prince', 'beneficiary'
        ];

        const hamKeywords = [
            'hi', 'hey', 'how', 'thanks', 'please', 'ok', 'yes', 'no', 'sure',
            'great', 'good', 'love', 'meeting', 'dinner', 'lunch', 'party',
            'tomorrow', 'today', 'tonight', 'see', 'talk', 'call', 'message'
        ];

        function predictSpam(message) {
            const lowerMsg = message.toLowerCase();
            const words = lowerMsg.split(/\s+/);

            let spamScore = 0;
            let hamScore = 0;

            // Check for spam keywords
            spamKeywords.forEach(keyword => {
                if (lowerMsg.includes(keyword)) {
                    spamScore += 2;
                }
            });

            // Check for ham keywords
            hamKeywords.forEach(keyword => {
                if (lowerMsg.includes(keyword)) {
                    hamScore += 1;
                }
            });

            // Check for uppercase ratio (spam tendency)
            const upperCaseCount = (message.match(/[A-Z]/g) || []).length;
            const upperRatio = upperCaseCount / message.length;
            if (upperRatio > 0.3) {
                spamScore += 3;
            }

            // Check for exclamation marks and special chars
            const exclamationCount = (message.match(/!/g) || []).length;
            if (exclamationCount > 2) {
                spamScore += 2;
            }

            // Calculate probabilities
            const totalScore = spamScore + hamScore;
            let spamProb, hamProb;

            if (totalScore === 0) {
                spamProb = 0.3;
                hamProb = 0.7;
            } else {
                spamProb = Math.min(spamScore / (totalScore + 5), 0.95);
                hamProb = 1 - spamProb;
            }

            // Add some randomness to simulate real ML confidence
            spamProb = Math.max(0, Math.min(1, spamProb + (Math.random() - 0.5) * 0.1));
            hamProb = 1 - spamProb;

            return {
                isSpam: spamProb > hamProb,
                spamProb: spamProb,
                hamProb: hamProb,
                confidence: Math.max(spamProb, hamProb)
            };
        }

        function classifyMessage() {
            const message = document.getElementById('message').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.remove('show');

            if (!message) {
                errorMsg.textContent = '❌ Please enter a message to classify!';
                errorMsg.classList.add('show');
                return;
            }

            if (message.length < 5) {
                errorMsg.textContent = '❌ Message is too short. Please enter at least 5 characters.';
                errorMsg.classList.add('show');
                return;
            }

            // Show loading
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.add('show');
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing message...</div>';

            // Simulate API call delay
            setTimeout(() => {
                const prediction = predictSpam(message);
                displayResult(prediction);
            }, 800);
        }

        function displayResult(prediction) {
            const resultBox = document.getElementById('resultBox');
            const resultClass = prediction.isSpam ? 'spam' : 'ham';
            const resultText = prediction.isSpam ? '🚨 SPAM DETECTED' : '✅ LEGITIMATE (HAM)';
            const confidence = (prediction.confidence * 100).toFixed(1);

            resultBox.className = `result-box ${resultClass}`;
            resultBox.innerHTML = `
                ${resultText}
                <div class="confidence">Confidence: ${confidence}%</div>
            `;

            // Update probability bars
            document.getElementById('spamBar').style.width = (prediction.spamProb * 100) + '%';
            document.getElementById('hamBar').style.width = (prediction.hamProb * 100) + '%';
            document.getElementById('spamPercent').textContent = (prediction.spamProb * 100).toFixed(1) + '%';
            document.getElementById('hamPercent').textContent = (prediction.hamProb * 100).toFixed(1) + '%';
        }

        function clearMessage() {
            document.getElementById('message').value = '';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('demoSection').style.display = 'none';
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('message').focus();
        }

        function loadDemoMessages() {
            const demoSection = document.getElementById('demoSection');
            const demoList = document.getElementById('demoList');

            if (demoSection.style.display === 'none') {
                let html = '';
                demoMessages.forEach((msg, index) => {
                    const icon = msg.type === 'spam' ? '🚨' : '✅';
                    html += `<div class="demo-msg" onclick="selectDemo(${index})">${icon} ${msg.text}</div>`;
                });
                demoList.innerHTML = html;
                demoSection.style.display = 'block';
            } else {
                demoSection.style.display = 'none';
            }
        }

        function selectDemo(index) {
            const msg = demoMessages[index];
            document.getElementById('message').value = msg.text;
            setTimeout(() => {
                classifyMessage();
            }, 100);
        }

        // Allow Enter key to classify
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                classifyMessage();
            }
        });

        // Focus on input when page loads
        window.addEventListener('load', function() {
            document.getElementById('message').focus();
        });
    </script>
</body>
</html>
